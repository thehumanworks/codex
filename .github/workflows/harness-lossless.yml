name: Harness verification with checkpoints

on:
  push:
    branches: [superfork/harness-final-2026-09-22]
    paths: [.github/workflows/harness-lossless.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harness-checkpointed-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'thehumanworks/codex'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Apply the reproduced RPC shutdown repair and verify harness helpers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/harness-verification"
          echo "EVIDENCE=$RUNNER_TEMP/harness-verification" >> "$GITHUB_ENV"
          git config user.name 'Codex Superfork Integration'
          git config user.email '178243268+thehumanworks@users.noreply.github.com'
          git fetch --no-tags --filter=blob:none --unshallow origin superfork/harness-final-2026-09-22
          git merge-base --is-ancestor 16d35f17ee1b30282e8f85e149ef01536e14dcc5 HEAD
          git merge-base --is-ancestor e3bd229c57231a4cf985cfd3100ff982dcd8cb7d HEAD
          git merge-base --is-ancestor d3e584093222018fc27919403aea149ccfd3bb38 HEAD
          if ! grep -q 'Keep the RPC execution gate open' codex-rs/app-server/src/in_process.rs; then
            python3 superfork/ports/fix_shutdown_drain.py
          fi
          python3 -m unittest discover -s superfork -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/harness-verification/helpers.log"
          git add codex-rs/app-server/src
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'fix(app-server): finish admitted RPCs before closing the connection gate'
          fi
      - name: Publish repaired source before long builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash superfork/publish_stage.sh source
      - uses: ./.github/actions/setup-ci
      - name: Native prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libcap-dev libasound2-dev bubblewrap clang lld
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/codex-ci/cargo-target
          key: harness-linux-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: harness-linux-1.95-
      - name: Scoped lint and required formatting
        run: |
          set -euo pipefail
          just fix -p codex-app-server --locked 2>&1 | tee "$EVIDENCE/clippy.log"
          just fmt 2>&1 | tee "$EVIDENCE/format.log"
          git add codex-rs/app-server/src superfork
          if ! git diff --cached --quiet; then
            git commit -m 'style(superfork): format the repaired runtime and checkpoint helpers'
          fi
          git diff --exit-code
          just fmt-check 2>&1 | tee "$EVIDENCE/format-check.log"
          git rev-parse HEAD > "$EVIDENCE/tested-sha.txt"
          git rev-parse HEAD:codex-rs > "$EVIDENCE/tested-code-tree.txt"
          rustc --version > "$EVIDENCE/toolchain.txt"
          cargo --version >> "$EVIDENCE/toolchain.txt"
          uname -a >> "$EVIDENCE/toolchain.txt"
      - name: Publish formatted checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash superfork/publish_stage.sh formatted
      - name: Behavioral acceptance and repeated concurrency checks
        run: |
          set -euo pipefail
          just test --locked -p codex-app-server --lib -E 'test(in_process)' --retries 0 2>&1 | tee "$EVIDENCE/acceptance.log"
          for attempt in 1 2 3 4 5; do
            just test --locked -p codex-app-server --lib -E 'test(lossless_tests) | test(shutdown_drain_tests)' --retries 0 2>&1 | tee "$EVIDENCE/concurrency-$attempt.log"
          done
          python3 superfork/record_verification.py acceptance
          git add superfork/evidence/final-acceptance.json
          git commit -m 'test(superfork): record actual acceptance and five concurrency repetitions'
      - name: Publish acceptance checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash superfork/publish_stage.sh acceptance
      - name: Full affected app-server and client suites
        run: |
          set -euo pipefail
          just test --locked -p codex-app-server -p codex-app-server-client 2>&1 | tee "$EVIDENCE/affected.log"
          python3 superfork/record_verification.py affected
          git add superfork/evidence/final-affected.json
          git commit -m 'test(superfork): record full affected app-server and client suites'
      - name: Publish affected-suite checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash superfork/publish_stage.sh affected
      - name: CLI build and preserved authentication smoke checks
        run: |
          set -euo pipefail
          (cd codex-rs && cargo build --locked -p codex-cli) 2>&1 | tee "$EVIDENCE/cli-build.log"
          "$CARGO_TARGET_DIR/debug/codex" --version | tee "$EVIDENCE/cli-version.txt"
          "$CARGO_TARGET_DIR/debug/codex" --help > "$EVIDENCE/cli-help.txt"
          "$CARGO_TARGET_DIR/debug/codex" exec --help > "$EVIDENCE/exec-help.txt"
          python3 scripts/test_chatgpt_env_auth.py --codex-bin "$CARGO_TARGET_DIR/debug/codex" 2>&1 | tee "$EVIDENCE/auth-smoke.log"
          python3 superfork/record_verification.py smoke
          git add superfork/evidence/final-smoke.json
          git commit -m 'test(superfork): verify built CLI and preserve environment authentication'
      - name: Publish runnable CLI checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash superfork/publish_stage.sh smoke
      - name: Complete workspace verification
        run: |
          set -euo pipefail
          just test --locked 2>&1 | tee "$EVIDENCE/workspace.log"
          python3 superfork/record_verification.py workspace
          git add superfork/evidence/final-workspace.json
          git commit -m 'test(superfork): record successful combined workspace verification'
      - name: Publish fully verified integration checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash superfork/publish_stage.sh workspace
      - name: Preserve diagnostic source and logs even after failures
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/harness-verification"
          git diff HEAD > "$RUNNER_TEMP/harness-verification/uncommitted.patch"
          git log -12 --format=fuller > "$RUNNER_TEMP/harness-verification/commits.txt"
          git archive --format=tar.gz --prefix=codex-harness/ HEAD > "$RUNNER_TEMP/harness-verification/source.tar.gz"
          df -h > "$RUNNER_TEMP/harness-verification/disk.txt"
          if test -f "$RUNNER_TEMP/harness-checkpoint-errors.txt"; then
            cp "$RUNNER_TEMP/harness-checkpoint-errors.txt" "$RUNNER_TEMP/harness-verification/"
          fi
      - name: Retain compiled dependencies independently of test success
        if: always() && steps.cache.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/codex-ci/cargo-target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-verification/
          retention-days: 14
