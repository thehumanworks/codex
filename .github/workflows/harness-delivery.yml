name: Harness delivery preparation

on:
  push:
    branches: [superfork/harness-delivery-2026-09-22]
    paths:
      - .github/workflows/harness-delivery.yml
      - superfork/prepare.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harness-delivery-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'thehumanworks/codex'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Preserve baseline and inspect feature compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash superfork/prepare.sh
      - name: Retain review source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-delivery-review-${{ github.run_id }}
          path: ${{ runner.temp }}/harness-review/
          retention-days: 14
