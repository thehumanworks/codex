name: Harness delivery preparation

on:
  push:
    branches: [superfork/harness-delivery-2026-09-22]
    paths:
      - .github/workflows/harness-delivery.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harness-delivery-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'thehumanworks/codex'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inspect ancestry and advertised feature sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Codex Superfork Integration'
          git config user.email '178243268+thehumanworks@users.noreply.github.com'
          mkdir -p superfork/evidence
          git fetch --no-tags --filter=blob:none --unshallow origin main
          git remote add upstream https://github.com/openai/codex.git
          upstream=d3e584093222018fc27919403aea149ccfd3bb38
          initial=e3bd229c57231a4cf985cfd3100ff982dcd8cb7d
          git fetch --no-tags --filter=blob:none upstream "$upstream:refs/remotes/upstream/pinned-main"
          common=$(git merge-base "$initial" "$upstream")
          printf 'fork_initial\t%s\nupstream_initial\t%s\ncommon_ancestor\t%s\n' "$initial" "$upstream" "$common" | tee superfork/evidence/baseline.tsv
          git log --format='%H %s' "$upstream..$initial" | tee superfork/evidence/fork-only-commits.txt
          git diff --stat "$common" "$initial" | tee superfork/evidence/fork-custom-stat.txt
          git diff "$common" "$initial" > superfork/evidence/fork-custom.patch
          git ls-remote --heads upstream > superfork/evidence/upstream-branch-heads.tsv
          wc -l superfork/evidence/upstream-branch-heads.tsv
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          rows, errors, pages = [], [], 0
          for page in range(1, 4):
              url = f'https://api.github.com/repos/openai/codex/pulls?state=open&sort=updated&direction=desc&per_page=100&page={page}'
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      items = json.load(response)
              except Exception as exc:
                  errors.append(f'page {page}: {type(exc).__name__}: {exc}')
                  break
              pages += 1
              for pr in items:
                  head = pr['head']
                  rows.append({'number': pr['number'], 'title': pr['title'], 'url': pr['html_url'], 'draft': pr['draft'], 'updated_at': pr['updated_at'], 'head_ref': head['ref'], 'head_sha': head['sha'], 'head_repository': (head.get('repo') or {}).get('full_name'), 'base_ref': pr['base']['ref']})
              if len(items) < 100:
                  break
          out = Path('superfork/evidence')
          (out / 'open-pr-sample.json').write_text(json.dumps({'coverage': 'At most 300 open PRs, ordered by most recently updated; NOT exhaustive and not a value ranking.', 'pages_fetched': pages, 'count': len(rows), 'errors': errors, 'pull_requests': rows}, indent=2) + '\n')
          selected = [row for row in rows if re.search(r'agent|hook|memory|context|resume|persist|event|session|tool|observab|compact', row['title'] + ' ' + row['head_ref'], re.I)]
          print('PR_DISCOVERY', json.dumps({'pages': pages, 'count': len(rows), 'errors': errors}))
          for row in selected:
              print('PR_LEAD', json.dumps(row))
          PY
          for source in a0ce4abc4069f91e3296ada835cbaf95a6ff0b75 16d35f17ee1b30282e8f85e149ef01536e14dcc5 218e45801afa0ab3a4c8bc6334d6bbf2d1e33925 bc4b55c09c0c4beccc1cac4825f21856272edac6 923df3e976a315019f4e2530070b8fd102d38e30; do
            git fetch --no-tags --filter=blob:none upstream "$source"
            printf '\nSOURCE %s\n' "$source"
            git log --oneline "$upstream..$source" | head -60 || true
            git diff --stat "$upstream...$source"
            git cherry "$upstream" "$source" > "superfork/evidence/cherry-$source.txt"
          done
      - name: Merge latest pinned upstream while preserving fork history
        shell: bash
        run: |
          set -euo pipefail
          upstream=d3e584093222018fc27919403aea149ccfd3bb38
          if ! git merge --no-ff "$upstream" -m 'merge(upstream): preserve fork customizations on pinned main'; then
            git diff --name-only --diff-filter=U | tee superfork/evidence/baseline-conflicts.txt
            git diff --cc > superfork/evidence/baseline-conflicts.patch
            echo 'Combined baseline has unresolved conflicts; nothing promoted.'
            cat superfork/evidence/baseline-conflicts.patch
            exit 1
          fi
          git merge-base --is-ancestor e3bd229c57231a4cf985cfd3100ff982dcd8cb7d HEAD
          git merge-base --is-ancestor "$upstream" HEAD
          printf 'combined_baseline\t%s\n' "$(git rev-parse HEAD)" | tee -a superfork/evidence/baseline.tsv
          git add superfork/evidence
          git commit -m 'docs(superfork): record combined baseline and bounded discovery evidence'
          git push origin HEAD:refs/heads/superfork/harness-delivery-2026-09-22
      - name: Retain investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-delivery-preparation-${{ github.run_id }}
          path: superfork/evidence/
          retention-days: 14
